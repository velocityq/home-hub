[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    live: reads the real house (only with HUB_LIVE=1 and a hub running on HUB_LIVE_URL, default port 8791)
    live_write: changes the real house and puts it back (only with HUB_LIVE_WRITE=1)
filterwarnings =
    ignore::DeprecationWarning
    ignore::aiohttp.web.NotAppKeyWarning
